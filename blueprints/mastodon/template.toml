[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
secret_key_base = "${password:64}"
otp_secret = "${password:32}"
active_record_encryption_deterministic_key = "${password:32}"
active_record_encryption_key_derivation_salt = "${password:32}"
active_record_encryption_primary_key = "${password:32}"

[config]

[[config.domains]]
serviceName = "web"
port = 3000
host = "${main_domain}"
path = "/"

[config.env]
LOCAL_DOMAIN = "${main_domain}"
WEB_DOMAIN = "${main_domain}"
SECRET_KEY_BASE = "${secret_key_base}"
OTP_SECRET = "${otp_secret}"
ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY = "${active_record_encryption_deterministic_key}"
ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT = "${active_record_encryption_key_derivation_salt}"
ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY = "${active_record_encryption_primary_key}"
DB_HOST = "db"
DB_PORT = "5432"
DB_NAME = "postgres"
DB_USER = "postgres"
DB_PASS = "${postgres_password}"
REDIS_HOST = "redis"
REDIS_PORT = "6379"
RAILS_ENV = "production"
RAILS_LOG_LEVEL = "info"
RAILS_SERVE_STATIC_FILES = "true"
WEB_CONCURRENCY = "5"
MAX_THREADS = "5"
PORT = "3000"
BIND = "0.0.0.0"
STREAMING_API_BASE_URL = "ws://${main_domain}"
STREAMING_CLUSTER_NUM = "1"
SIDEKIQ_CONCURRENCY = "5"
SMTP_SERVER = "smtp.example.com"
SMTP_PORT = "587"
SMTP_LOGIN = "your-email@example.com"
SMTP_PASSWORD = "your-email-password"
SMTP_FROM_ADDRESS = "notifications@${main_domain}"
SMTP_DOMAIN = "${main_domain}"
SMTP_AUTH_METHOD = "plain"
SMTP_OPENSSL_VERIFY_MODE = "none"
SMTP_ENABLE_STARTTLS_AUTO = "true"
SINGLE_USER_MODE = "false"
FEDERATION_ENABLED = "true"
AUTHORIZED_FETCH = "false"
PAPERCLIP_ROOT_PATH = "/mastodon/public/system"
PAPERCLIP_ROOT_URL = "/system"

[[config.mounts]]
serviceName = "db"
volumeName = "postgres14"
mountPath = "/var/lib/postgresql/data"

[[config.mounts]]
serviceName = "redis"
volumeName = "redis"
mountPath = "/data"

[[config.mounts]]
serviceName = "web"
volumeName = "public_system"
mountPath = "/mastodon/public/system"

[[config.mounts]]
serviceName = "web"
volumeName = "public_assets"
mountPath = "/mastodon/public/assets"

[[config.mounts]]
serviceName = "sidekiq"
volumeName = "public_system"
mountPath = "/mastodon/public/system"

