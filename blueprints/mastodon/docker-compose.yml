# This file is designed for production server deployment, not local development work
# For a containerized local dev environment, see: https://github.com/mastodon/mastodon/blob/main/docs/DEVELOPMENT.md#docker

version: "3.8"

services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      - postgres14:/var/lib/postgresql/data
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'

  redis:
    restart: always
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - redis:/data

  web:
    image: ghcr.io/mastodon/mastodon:v4.5.0
    restart: always
    environment:
      - LOCAL_DOMAIN=${LOCAL_DOMAIN}
      - WEB_DOMAIN=${WEB_DOMAIN}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OTP_SECRET=${OTP_SECRET}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - RAILS_ENV=${RAILS_ENV}
      - RAILS_LOG_LEVEL=${RAILS_LOG_LEVEL}
      - RAILS_SERVE_STATIC_FILES=${RAILS_SERVE_STATIC_FILES}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY}
      - MAX_THREADS=${MAX_THREADS}
      - PORT=${PORT}
      - BIND=${BIND}
      - STREAMING_API_BASE_URL=${STREAMING_API_BASE_URL}
      - STREAMING_CLUSTER_NUM=${STREAMING_CLUSTER_NUM}
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_LOGIN=${SMTP_LOGIN}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_AUTH_METHOD=${SMTP_AUTH_METHOD}
      - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
      - SINGLE_USER_MODE=${SINGLE_USER_MODE}
      - FEDERATION_ENABLED=${FEDERATION_ENABLED}
      - AUTHORIZED_FETCH=${AUTHORIZED_FETCH}
      - PAPERCLIP_ROOT_PATH=${PAPERCLIP_ROOT_PATH}
      - PAPERCLIP_ROOT_URL=${PAPERCLIP_ROOT_URL}
    command: sh -c "sleep 10 && (bundle exec rails db:create || true) && bundle exec rails db:migrate && (test -f /mastodon/public/assets/manifest.json || bundle exec rails assets:precompile) && bundle exec puma -C config/puma.rb"
    healthcheck:
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    ports:
      - 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - public_system:/mastodon/public/system
      - public_assets:/mastodon/public/assets

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.5.0
    restart: always
    environment:
      - LOCAL_DOMAIN=${LOCAL_DOMAIN}
      - WEB_DOMAIN=${WEB_DOMAIN}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OTP_SECRET=${OTP_SECRET}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - RAILS_ENV=${RAILS_ENV}
      - STREAMING_API_BASE_URL=${STREAMING_API_BASE_URL}
      - STREAMING_CLUSTER_NUM=${STREAMING_CLUSTER_NUM}
    command: node ./streaming/index.js
    healthcheck:
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    expose:
      - 4000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.5.0
    restart: always
    environment:
      - LOCAL_DOMAIN=${LOCAL_DOMAIN}
      - WEB_DOMAIN=${WEB_DOMAIN}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OTP_SECRET=${OTP_SECRET}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - RAILS_ENV=${RAILS_ENV}
      - RAILS_LOG_LEVEL=${RAILS_LOG_LEVEL}
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY}
      - PAPERCLIP_ROOT_PATH=${PAPERCLIP_ROOT_PATH}
      - PAPERCLIP_ROOT_URL=${PAPERCLIP_ROOT_URL}
    command: bundle exec sidekiq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    volumes:
      - public_system:/mastodon/public/system
      - public_assets:/mastodon/public/assets
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ [78]' || false"]

volumes:
  postgres14:
  redis:
  public_system:
  public_assets:

