[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
secret_key = "${password:64}"
clickhouse_api_password = "${password:32}"
clickhouse_app_password = "${password:32}"
minio_root_user = "${username}"
minio_root_password = "${password:32}"
site_url = "http://${main_domain}"

[config]

[[config.domains]]
serviceName = "proxy"
port = 80
host = "${main_domain}"

[config.env]
env = [
'SITE_URL=${site_url}',
'SECRET_KEY=${secret_key}',
'POSTGRES_PASSWORD=${postgres_password}',
'CLICKHOUSE_API_PASSWORD=${clickhouse_api_password}',
'CLICKHOUSE_APP_PASSWORD=${clickhouse_app_password}',
'MINIO_ROOT_USER=${minio_root_user}',
'MINIO_ROOT_PASSWORD=${minio_root_password}',
]

[[config.mounts]]

