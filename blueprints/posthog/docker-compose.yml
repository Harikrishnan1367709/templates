version: "3.8"

services:
  proxy:
    image: caddy:2
    entrypoint: sh
    restart: unless-stopped
    command: -c 'set -x && echo "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
    volumes:
      - caddy-data:/root/.caddy
    environment:
      CADDY_TLS_BLOCK: ''
      CADDY_HOST: 'http://localhost:8000'
      CADDYFILE: |
        {
        ${CADDY_TLS_BLOCK:-}
        }
        ${CADDY_HOST:-http://localhost:8000} {
            @replay-capture {
                path /s
                path /s/
                path /s/*
            }
            @capture {
                path /e
                path /e/
                path /e/*
                path /i/v0
                path /i/v0/
                path /i/v0/*
                path /batch
                path /batch/
                path /batch/*
                path /capture
                path /capture/
                path /capture/*
            }
            @flags {
                path /flags
                path /flags/
                path /flags/*
            }
            @webhooks {
                path /public/webhooks
                path /public/webhooks/
                path /public/webhooks/*
                path /public/m/
                path /public/m/*
            }
            handle @capture {
                reverse_proxy capture:3000
            }
            handle @replay-capture {
                reverse_proxy replay-capture:3000
            }
            handle @flags {
                reverse_proxy feature-flags:3001
            }
            handle @webhooks {
                reverse_proxy plugins:6738
            }
            handle {
                reverse_proxy web:8000
            }
        }

  db:
    image: postgres:12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posthog}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - redis-data:/data

  redis7:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - redis7-data:/data

  clickhouse:
    image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:25.6.13.41}
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: 'kafka:9092'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  zookeeper:
    image: zookeeper:3.7.0
    restart: unless-stopped
    volumes:
      - zookeeper-data:/data

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 2
      - --memory 3G
      - --reserve-memory 500M
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    environment:
      ALLOW_PLAINTEXT_LISTENER: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9644/v1/status/ready || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  objectstorage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    volumes:
      - minio-data:/data

  maildev:
    image: maildev/maildev:2.0.5
    restart: unless-stopped
    healthcheck:
      test: wget -qO- http://127.0.0.1:1080/healthz || exit 1
      interval: 3s
      timeout: 1s
      retries: 3

  flower:
    image: mher/flower:2.0.0
    restart: unless-stopped
    environment:
      FLOWER_PORT: 5555
      CELERY_BROKER_URL: redis://redis:6379

  worker:
    image: ${POSTHOG_IMAGE:-posthog/posthog:latest}
    command: ./bin/docker-worker-celery --with-scheduler
    restart: unless-stopped
    environment: &worker_env
      OTEL_SDK_DISABLED: 'true'
      DISABLE_SECURE_SSL_REDIRECT: 'true'
      IS_BEHIND_PROXY: 'true'
      DATABASE_URL: 'postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog'
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_DATABASE: 'posthog'
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      CLICKHOUSE_API_USER: 'api'
      CLICKHOUSE_API_PASSWORD: '${CLICKHOUSE_API_PASSWORD}'
      CLICKHOUSE_APP_USER: 'app'
      CLICKHOUSE_APP_PASSWORD: '${CLICKHOUSE_APP_PASSWORD}'
      API_QUERIES_PER_TEAM: '{"1": 100}'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      PGHOST: db
      PGUSER: posthog
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEPLOYMENT: hobby
      CDP_API_URL: 'http://plugins:6738'
      FLAGS_REDIS_ENABLED: false
      SECRET_KEY: ${SECRET_KEY}
      SITE_URL: ${SITE_URL}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
      kafka:
        condition: service_started

  web:
    image: ${POSTHOG_IMAGE:-posthog/posthog:latest}
    command: sh -c "export PORT=8000 && export HOST=0.0.0.0 && ./bin/start-backend"
    restart: unless-stopped
    environment:
      <<: *worker_env
      SKIP_SERVICE_WORKER: 'true'
      DISABLE_SECURE_SSL_REDIRECT: 'true'
      IS_BEHIND_PROXY: 'true'
      PORT: '8000'
      HOST: '0.0.0.0'
      PYTHONUNBUFFERED: '1'
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
      kafka:
        condition: service_started

  capture:
    image: ${POSTHOG_CAPTURE_IMAGE:-ghcr.io/posthog/posthog/capture:master}
    restart: unless-stopped
    environment:
      ADDRESS: '0.0.0.0:3000'
      KAFKA_TOPIC: 'events_plugin_ingestion'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      CAPTURE_MODE: events
      RUST_LOG: 'info,rdkafka=warn'
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started

  replay-capture:
    image: ${POSTHOG_CAPTURE_IMAGE:-ghcr.io/posthog/posthog/capture:master}
    restart: unless-stopped
    environment:
      ADDRESS: '0.0.0.0:3000'
      KAFKA_TOPIC: 'session_recording_snapshot_item_events'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      CAPTURE_MODE: recordings
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started

  feature-flags:
    image: ${POSTHOG_FEATURE_FLAGS_IMAGE:-ghcr.io/posthog/posthog/feature-flags:master}
    restart: unless-stopped
    environment:
      WRITE_DATABASE_URL: 'postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog'
      READ_DATABASE_URL: 'postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog'
      REDIS_URL: 'redis://redis:6379/'
      ADDRESS: '0.0.0.0:3001'
      RUST_LOG: 'info'
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      redis7:
        condition: service_started

  plugins:
    image: ${POSTHOG_IMAGE:-posthog/posthog:latest}
    command: ./bin/plugin-server --no-restart-loop
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog'
      PERSONS_DATABASE_URL: 'postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog'
      BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_DATABASE: 'posthog'
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY}
      SITE_URL: ${SITE_URL}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
      kafka:
        condition: service_started

  migrate:
    image: ${POSTHOG_IMAGE:-posthog/posthog:latest}
    command: sh -c "python manage.py migrate && python manage.py migrate_clickhouse && python manage.py run_async_migrations"
    restart: 'no'
    environment:
      <<: *worker_env
    depends_on:
      db:
        condition: service_started
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  redis7-data:
  clickhouse-data:
  zookeeper-data:
  redpanda-data:
  minio-data:

